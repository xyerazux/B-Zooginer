# Supabase configuration file for B-Zooginer
project_id = "b-zooginer"

[api]
port = 54321
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
port = 54323

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/**"]
jwt_expiry = 3600
enable_signup = false # Group admins are created by Master Admin only

[storage]
enabled = true
file_size_limit = "2MiB"

[functions.submit-order]
verify_jwt = false # Public order submission allows anonymous access

[functions.create-group-admin]
verify_jwt = true # Strictly requires authenticated Master Admin
